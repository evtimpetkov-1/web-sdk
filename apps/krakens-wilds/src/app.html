<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
		<style>
			/* Kraken's Wilds modal theme — overrides components-ui-html defaults */
			:root {
				--modal-panel-bg: linear-gradient(180deg, rgba(10, 38, 56, 0.94) 0%, rgba(4, 14, 26, 0.97) 100%);
				--modal-panel-border: 1px solid rgba(64, 200, 224, 0.35);
				--modal-panel-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 180, 216, 0.12),
					inset 0 1px 0 rgba(160, 230, 255, 0.15);
				--modal-title-font: 'Cinzel', serif;
				--modal-title-size: 1.5rem;
				--modal-text: #eaf6ff;
				--modal-text-dim: rgba(196, 226, 240, 0.65);
				--modal-accent: #59d8f2;
				--modal-accent-selected: #ffc93c;
				--modal-border: rgba(120, 200, 224, 0.25);
				--modal-border-selected: rgba(255, 201, 60, 0.85);
				--modal-bg: rgba(18, 60, 84, 0.35);
				--modal-bg-hover: rgba(64, 180, 216, 0.28);
				--modal-bg-active: rgba(30, 90, 120, 0.45);
				--modal-btn-bg: rgba(16, 52, 74, 0.55);
				--modal-btn-bg-hover: rgba(48, 140, 178, 0.5);
				--modal-btn-confirm-bg: linear-gradient(180deg, rgba(0, 172, 208, 0.5), rgba(0, 96, 138, 0.6));
				--modal-btn-confirm-border: rgba(89, 216, 242, 0.7);
				--modal-divider: linear-gradient(90deg, transparent, rgba(255, 201, 60, 0.9), transparent);
			}
		</style>
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
